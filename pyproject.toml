[project]
name = "cdet_scorer"
version = "1.5.0"
authors = [
  { name="Ian Soboroff", email="ian.soboroff@nist.gov" }
]
description = "Scorer for the TREC Change Detection track"
readme = "README.md"
requires-python = ">3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic",
  "peewee",
  "fastapi",
  "uvicorn"
]

license.file = "LICENSE"

[project.urls]
Homepage = "https://trec-changedet.github.io"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.trec_info]
trec = "TREC 2026"
score_release_date = "2026-11-14"

